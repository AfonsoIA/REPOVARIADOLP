<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostico de Potencial DOXA - V1</title>
    <style>
      :root {
        --bg: #f5f5f2;
        --surface: #ffffff;
        --surface-strong: #111111;
        --surface-soft: #f0f0eb;
        --text: #111111;
        --text-soft: #5b5b55;
        --border: rgba(17, 17, 17, 0.1);
        --success: #19a34a;
        --success-strong: #11853a;
        --danger: #df2d24;
        --accent: #111111;
        --radius-sm: 14px;
        --radius-md: 22px;
        --shadow: none;
        --space-1: 8px;
        --space-2: 12px;
        --space-3: 16px;
        --space-4: 20px;
        --space-5: 24px;
        --space-6: 32px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #fcfcfa 0%, #f3f3ef 100%);
        color: var(--text);
      }

      a {
        color: inherit;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-4);
      }

      .phone {
        width: min(100%, 420px);
        min-height: 820px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 32px;
        overflow: hidden;
      }

      .app {
        min-height: 820px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        padding: var(--space-4) var(--space-4) var(--space-3);
        border-bottom: 1px solid rgba(17, 17, 17, 0.06);
      }

      .progress-track {
        height: 7px;
        background: #e6e6e0;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 14%;
        background: #111111;
        border-radius: 999px;
        transition: width 220ms ease;
      }

      .progress-meta {
        margin-top: var(--space-2);
        display: flex;
        justify-content: space-between;
        color: var(--text-soft);
        font-size: 13px;
      }

      .view {
        display: none;
        padding: var(--space-4);
        gap: var(--space-4);
      }

      .view.active {
        display: grid;
      }

      .eyebrow {
        display: inline-flex;
        width: fit-content;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fafaf7;
        color: var(--text-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .hero {
        width: 100%;
        aspect-ratio: 1.05 / 1;
        border-radius: 28px;
        border: 1px solid var(--border);
        overflow: hidden;
        background: linear-gradient(160deg, #1a1a1a, #52523f);
        display: grid;
        place-items: end start;
        padding: var(--space-4);
        color: #fff;
      }

      .hero.alt {
        background: linear-gradient(160deg, #5c2f12, #141414);
      }

      .hero.soft {
        background: linear-gradient(160deg, #1c4730, #101010);
      }

      .hero-media {
        position: relative;
        padding: 0;
        place-items: stretch;
        background: #111111;
      }

      .hero-media img,
      .feature-image img,
      .proof-photo,
      .thumb-button img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .hero-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: end;
        padding: var(--space-4);
        background: linear-gradient(180deg, rgba(17, 17, 17, 0.04), rgba(17, 17, 17, 0.7));
        color: #fff;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(32px, 8vw, 44px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      h2 {
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      h3 {
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .lead {
        font-size: 17px;
        line-height: 1.45;
        color: var(--text-soft);
      }

      .lead strong,
      .copy strong {
        color: var(--text);
      }

      .copy {
        font-size: 16px;
        line-height: 1.5;
        color: var(--text-soft);
      }

      .choices,
      .bullets,
      .proof-grid,
      .benefits {
        display: grid;
        gap: var(--space-3);
      }

      .choice {
        width: 100%;
        text-align: left;
        border: 1px solid rgba(17, 17, 17, 0.12);
        background: #111111;
        color: #ffffff;
        border-radius: 22px;
        padding: 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 72px;
        font-weight: 700;
        font-size: 20px;
        line-height: 1.15;
        cursor: pointer;
      }

      .choice::before {
        content: "";
        width: 26px;
        height: 26px;
        flex: 0 0 26px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.06);
      }

      .bullet,
      .benefit,
      .field-card,
      .proof-card,
      .result-card,
      .tracker-card,
      .note-card {
        border: 1px solid var(--border);
        border-radius: 22px;
        background: #fbfbf8;
      }

      .bullet,
      .benefit,
      .result-card,
      .tracker-card,
      .note-card {
        padding: 16px 18px;
      }

      .bullet strong,
      .benefit strong,
      .result-card strong,
      .tracker-card strong,
      .note-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .bullet .label {
        color: var(--danger);
        font-weight: 800;
      }

      .cta,
      .ghost,
      .secondary {
        width: 100%;
        min-height: 58px;
        border: 0;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      .cta {
        background: var(--success);
        color: #fff;
      }

      .cta:hover {
        background: var(--success-strong);
      }

      .ghost {
        background: #111111;
        color: #fff;
      }

      .secondary {
        background: #fff;
        color: var(--text);
        border: 1px solid rgba(17, 17, 17, 0.14);
      }

      .proof-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .proof-card {
        overflow: hidden;
        background: #111111;
        color: #fff;
      }

      .proof-top {
        min-height: 164px;
        padding: 16px;
        display: flex;
        align-items: end;
        background:
          linear-gradient(180deg, rgba(17, 17, 17, 0.14), rgba(17, 17, 17, 0.82)),
          radial-gradient(circle at top left, #444, #111 72%);
      }

      .proof-top.image {
        min-height: 188px;
        padding: 0;
        position: relative;
        background: #111111;
      }

      .proof-body {
        padding: 16px;
      }

      .proof-label {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .proof-number {
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
      }

      .offer {
        background: linear-gradient(180deg, #f1fff2, #e7f8ea);
        border: 1px solid rgba(25, 163, 74, 0.18);
        border-radius: 24px;
        padding: 18px;
        display: grid;
        gap: 12px;
      }

      .offer .price {
        font-size: 34px;
        line-height: 1;
        font-weight: 900;
        color: var(--success-strong);
      }

      .price-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .price-note {
        font-size: 12px;
        color: #287345;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .feature-image {
        overflow: hidden;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: #111111;
      }

      .premium-stack,
      .trust-row {
        display: grid;
        gap: 12px;
      }

      .premium-card {
        border: 1px solid rgba(17, 17, 17, 0.08);
        border-radius: 22px;
        background: #ffffff;
        padding: 16px 18px;
      }

      .premium-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .trust-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .trust-pill {
        border: 1px solid rgba(17, 17, 17, 0.08);
        border-radius: 16px;
        background: #fbfbf8;
        padding: 12px 10px;
        text-align: center;
        font-size: 12px;
        line-height: 1.35;
        color: var(--text-soft);
      }

      .trust-pill strong {
        display: block;
        font-size: 13px;
        color: var(--text);
        margin-bottom: 2px;
      }

      .thumb-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3);
      }

      .thumb-button {
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: #111111;
        padding: 0;
        min-height: 168px;
      }

      .field-stack {
        display: grid;
        gap: 14px;
      }

      .field-card {
        padding: 14px;
        background: #fff;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-soft);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 48px;
        border-radius: 14px;
        border: 1px solid rgba(17, 17, 17, 0.1);
        background: #f7f7f4;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid rgba(25, 163, 74, 0.18);
        border-color: rgba(25, 163, 74, 0.32);
      }

      .sticky {
        margin-top: auto;
        position: sticky;
        bottom: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 22%);
        padding-top: 20px;
      }

      .mini {
        font-size: 13px;
        line-height: 1.4;
        color: var(--text-soft);
      }

      .footer-legal {
        margin-top: var(--space-2);
        text-align: center;
        font-size: 12px;
        color: #7b7b73;
      }

      .data-box {
        background: #111111;
        color: #cbffd9;
        border-radius: 18px;
        padding: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        overflow: auto;
      }

      .status-card {
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 16px;
        font-size: 13px;
        line-height: 1.45;
      }

      .status-card.info {
        background: #f5f9ff;
        border-color: rgba(46, 102, 243, 0.14);
        color: #23408e;
      }

      .status-card.success {
        background: #eefbf1;
        border-color: rgba(25, 163, 74, 0.18);
        color: #166a33;
      }

      .status-card.warning {
        background: #fff7eb;
        border-color: rgba(199, 123, 28, 0.18);
        color: #8c5310;
      }

      .status-card.error {
        background: #fff1f0;
        border-color: rgba(223, 45, 36, 0.18);
        color: #8f221c;
      }

      @media (max-width: 430px) {
        .shell {
          padding: 0;
        }

        .phone {
          width: 100%;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
        }
      }
    </style>
  </head>

                  <img src="${assets.step5Case1}" alt="Prova social um" />
                </button>
                <button class="thumb-button" type="button">
                  <img src="${assets.step5Case2}" alt="Prova social dois" />
                </button>
              </div>
              <div class="sticky">
                <button class="cta" data-next="step-6-captura">Quero pagar R$127 e liberar meu agendamento</button>
                <p class="mini" style="margin-top:12px">Depois do pagamento, voce escolhe o horario no Calendly.</p>
              </div>
            </section>
          `
        },
        {
          id: "step-6-captura",
          progress: 85,
          render: () => `
            <section class="view active">
              <span class="eyebrow">Captura antes do pagamento</span>
              <div>
                <h2>Antes do pagamento, preciso do basico para preparar seu diagnostico.</h2>
                <p class="lead">Esses dados entram no bastidor do fluxo para organizar pagamento, agenda e contexto da analise — sem friccao na sua experiencia.</p>
              </div>
              <form class="field-stack" id="leadForm">
                <div class="field-card">
                  <label>Nome
                    <input name="name" autocomplete="name" placeholder="Seu nome" required />
                  </label>
                </div>
                <div class="field-card">
                  <label>Email
                    <input name="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" required />
                  </label>
                </div>
                <div class="field-card">
                  <label>WhatsApp
                    <input name="whatsapp" autocomplete="tel" inputmode="tel" placeholder="(11) 99999-9999" required />
                  </label>
                </div>
                <div class="field-card">
                  <label>Instagram
                    <input name="instagram" autocomplete="off" placeholder="@seuperfil" />
                  </label>
                </div>
                <div class="field-card">
                  <label>Seu nicho hoje
                    <select name="niche" required>
                      <option value="">Selecione</option>
                      <option value="infoproduto">Infoproduto / Educacao</option>
                      <option value="servicos">Servicos / Consultoria</option>
                      <option value="profissional-liberal">Profissional liberal</option>
                      <option value="imobiliario">Imobiliario</option>
                      <option value="saude">Saude</option>
                      <option value="outro">Outro</option>
                    </select>
                  </label>
                </div>
                <div class="sticky">
                  <button class="cta" type="submit">Continuar para o pagamento</button>
                </div>
              </form>
            </section>
          `
        },
        {
          id: "step-7-pagamento",
          progress: 92,
          render: () => `
            <section class="view active">
              <span class="eyebrow">Pagamento da call</span>
              <div class="hero soft hero-media">
                <img src="${assets.step5Hero}" alt="Pagamento do diagnostico" />
                <div class="hero-overlay">
                <div>
                  <h3>Seu diagnostico esta quase liberado.</h3>
                </div>
                </div>
              </div>
              <div class="result-card">
                <strong>O que acontece agora</strong>
                <p class="mini">Voce paga <strong>R$127</strong> no Stripe e, assim que o pagamento aprovar, o proprio Stripe redireciona voce direto para a agenda no Calendly.</p>
              </div>
              <div class="premium-stack">
                <div class="premium-card">
                  <strong>O que voce esta reservando</strong>
                  <p class="mini">Uma analise estrategica com foco em gargalo, angulo de conteudo, narrativa e proxima melhor acao para acelerar percepcao e demanda.</p>
                </div>
                <div class="premium-card">
                  <strong>Como funciona na pratica</strong>
                  <p class="mini">Pagamento seguro no Stripe, aprovacao imediata e redirecionamento automatico para a sua agenda no Calendly.</p>
                </div>
              </div>
              <div class="note-card">
                <strong>Se algo travar no meio do caminho</strong>
                <p class="mini">Voce ainda pode abrir a agenda manualmente logo abaixo. O objetivo aqui e nao perder uma unica pessoa pronta para agir.</p>
              </div>
              <div class="sticky">
                <button class="cta" id="paymentButton">Pagar R$127 e seguir para a agenda</button>
                <button class="secondary" id="bookingButton" style="margin-top:12px">Se nao redirecionar, abrir agenda manualmente</button>
                <button class="secondary" id="whatsappButton" style="margin-top:12px">Falar no WhatsApp</button>
                <p class="mini" style="margin-top:12px">Pagamento seguro via Stripe. A agenda abre em seguida para voce concluir o horario.</p>
              </div>
            </section>
          `
        }
      ];

      const state = {
        currentIndex: 0,
        leadId: crypto?.randomUUID ? crypto.randomUUID() : `lead_${Date.now()}`,
        answers: {},
        lead: {},
        sync: {
          status: "idle",
          message: ""
        },
        tracking: captureAttribution()
      };

      function captureAttribution() {
        const params = new URLSearchParams(window.location.search);
        const keys = [
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_content",
          "utm_term",
          "fbclid",
          "gclid",
          "ttclid",
          "wbraid",
          "gbraid"
        ];

        const stored = JSON.parse(localStorage.getItem("doxa_attribution") || "{}");
        const next = { ...stored };

        keys.forEach((key) => {
          const value = params.get(key);
          if (value) next[key] = value;
        });

        if (!next.first_touch_ts) next.first_touch_ts = new Date().toISOString();
        next.quiz_version = config.quizVersion;
        next.landing_slug = "dailtonrolim-2";

        localStorage.setItem("doxa_attribution", JSON.stringify(next));
        return next;
      }

      function fireEvent(name, data = {}) {
        const payload = {
          event: name,
          timestamp: new Date().toISOString(),
          quiz_version: config.quizVersion,
          step_id: steps[state.currentIndex]?.id,
          ...data
        };

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(payload);

        if (typeof window.fbq === "function") {
          window.fbq("trackCustom", name, payload);
        }

        if (typeof window.gtag === "function") {
          window.gtag("event", name, payload);
        }

        if (window.ttq && typeof window.ttq.track === "function") {
          window.ttq.track(name, payload);
        }

        console.log("[tracking]", payload);
      }

      function renderStep(index) {
        state.currentIndex = index;
        const step = steps[index];
        document.getElementById("views").innerHTML = step.render();
        document.getElementById("progressFill").style.width = `${step.progress}%`;
        document.getElementById("progressLabel").textContent = `Etapa ${index + 1} de ${config.totalSteps}`;
        bindStep();
        fireEvent("quiz_step_view", { step_number: index + 1, step_name: step.id });
      }

      function bindStep() {
        document.querySelectorAll("[data-next]").forEach((element) => {
          element.addEventListener("click", () => {
            const answerKey = element.dataset.answerKey;
            const answerValue = element.dataset.answerValue;

            if (answerKey && answerValue) {
              state.answers[answerKey] = answerValue;
              fireEvent("quiz_step_complete", {
                step_number: state.currentIndex + 1,
                answer_key: answerKey,
                answer_value: answerValue
              });
            } else {
              fireEvent("quiz_step_complete", {
                step_number: state.currentIndex + 1
              });
            }

            const nextId = element.dataset.next;
            const nextIndex = steps.findIndex((step) => step.id === nextId);
            if (nextIndex >= 0) renderStep(nextIndex);
          });
        });

        const form = document.getElementById("leadForm");
        if (form) {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const submitButton = form.querySelector('button[type="submit"]');
            if (submitButton) {
              submitButton.disabled = true;
              submitButton.textContent = "Preparando seu pagamento...";
            }
            const formData = new FormData(form);
            state.lead = Object.fromEntries(formData.entries());
            fireEvent("lead_submit", {
              step_number: state.currentIndex + 1,
              niche: state.lead.niche
            });
            const syncResult = await syncLeadCapture();
            if (syncResult.status === "error") {
              if (submitButton) {
                submitButton.disabled = false;
                submitButton.textContent = "Continuar para o pagamento";
              }
              window.alert("Tivemos uma instabilidade ao preparar seu acesso. Tente novamente em alguns segundos.");
              return;
            }
            renderStep(6);
          });
        }

        const paymentButton = document.getElementById("paymentButton");
        if (paymentButton) {
          paymentButton.addEventListener("click", () => {
            fireEvent("begin_checkout", buildHandoffPayload());
            window.open(buildStripeUrl(), "_blank", "noopener,noreferrer");
          });
        }

        const bookingButton = document.getElementById("bookingButton");
        if (bookingButton) {
          bookingButton.addEventListener("click", () => {
            fireEvent("schedule_start", buildHandoffPayload());
            window.open(buildBookingUrl(), "_blank", "noopener,noreferrer");
          });
        }

        const whatsappButton = document.getElementById("whatsappButton");
        if (whatsappButton) {
          whatsappButton.addEventListener("click", () => {
            const text = encodeURIComponent("Oi, vim do diagnostico da DOXA e quero tirar uma duvida antes de agendar.");
            window.open(`https://wa.me/5500000000000?text=${text}`, "_blank", "noopener,noreferrer");
          });
        }
      }

      function buildHandoffPayload() {
        return {
          lead_id: state.leadId,
          ...state.tracking,
          ...state.answers,
          ...state.lead,
          quiz_version: config.quizVersion
        };
      }

      function buildBookingUrl() {
        const url = new URL(config.bookingUrl);
        const payload = buildHandoffPayload();
        if (payload.name) url.searchParams.set("name", payload.name);
        if (payload.email) url.searchParams.set("email", payload.email);
        if (payload.whatsapp) url.searchParams.set("a1", payload.whatsapp);
        if (payload.instagram) url.searchParams.set("a2", payload.instagram);
        if (payload.niche) url.searchParams.set("a3", payload.niche);
        if (payload.motivo) url.searchParams.set("a4", payload.motivo);
        url.searchParams.set("utm_campaign", payload.utm_campaign || config.quizVersion);
        url.searchParams.set("utm_source", payload.utm_source || "quiz-doxa");
        return url.toString();
      }

      function buildStripeUrl() {
        const url = new URL(config.stripeUrl);
        const payload = buildHandoffPayload();
        if (payload.email) url.searchParams.set("prefilled_email", payload.email);
        return url.toString();
      }

      async function syncLeadCapture() {
        const targetUrl = config.appsScriptWebhookUrl || config.leadCaptureWebhookUrl;

        if (!targetUrl) {
          state.sync = {
            status: "warning",
            message: "Webhook de captura ainda nao configurado. O fluxo segue em modo demo."
          };
          return state.sync;
        }

        const payload = buildHandoffPayload();

        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          state.sync = {
            status: "success",
            message: "Lead enviado para a camada de captura antes do pagamento."
          };
          return state.sync;
        } catch (error) {
          state.sync = {
            status: "error",
            message: `Falha ao enviar lead para o Google Sheets: ${error.message}`
          };
          return state.sync;
        }
      }

      fireEvent("quiz_view", state.tracking);
      fireEvent("quiz_start", { step_number: 1 });
      renderStep(0);
    </script>
  </body>
</html>
